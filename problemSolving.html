        <h1>Problem Solving</h1>
        <h2>The Method:</h2>
        <ol>
            <li>Write the problem down.</li>
            <li>Brainstorm possible solutions and write them down.</li>
            <li>Choose one of the solutions.</li>
            <li>Write down the steps you'll need to take for that solution.</li>
            <li>TRY your solution and then review how it works.</li>
        </ol>
